# GateKeep — full local stack with REAL on-chain settlement.
#
#   docker compose up --build
#
# Brings up three services:
#   1. anvil     — a local EVM chain (chain id 43113, mimicking Avalanche Fuji)
#   2. deployer  — deploys MockUSDC + mints test USDC to the agent, then exits
#   3. gatekeep  — the API + gateway + dashboard, settling on-chain via anvil
#
# Then open http://localhost:4021 and click "Run agent" to watch USDC move
# on-chain. Anvil's RPC is exposed on :8545 (e.g. `cast` against it).

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--chain-id", "43113"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 3s
      timeout: 3s
      retries: 20

  deployer:
    build: .
    depends_on:
      anvil:
        condition: service_healthy
    env_file:
      - .env.chain
    environment:
      RPC_URL: http://anvil:8545
    command: ["npm", "run", "chain:deploy"]
    restart: "no"

  gatekeep:
    build: .
    depends_on:
      deployer:
        condition: service_completed_successfully
    env_file:
      - .env.chain
    environment:
      RPC_URL: http://anvil:8545
      PUBLIC_BASE_URL: http://localhost:4021
    ports:
      - "4021:4021"
